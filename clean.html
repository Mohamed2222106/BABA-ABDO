<!DOCTYPE html><html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة الطلبات - بابا عبده</title>
  <style>
    body { margin:0; padding:0; font-family: Arial, sans-serif; direction: rtl; background: #f5f5f5; }
    header { background: #ff6600; color: white; padding: 15px; text-align: center; font-size: 24px; }
    .container { display: grid; grid-template-columns: 200px 1fr 300px; height: calc(100vh - 60px); }
    .sidebar { background: #fff; padding: 10px; border-left: 1px solid #ddd; overflow-y: auto; }
    .sidebar h3 { margin-top: 0; color: #ff6600; }
    .sidebar ul { list-style: none; padding: 0; margin: 0; }
    .sidebar li { padding: 8px; margin: 4px 0; cursor: pointer; border-radius: 5px; }
    .sidebar li.active, .sidebar li:hover { background: #ff6600; color: white; }
    .main { background: #fff; padding: 15px; overflow-y: auto; }
    .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
    .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; }
    .card h4 { margin: 0 0 5px; font-size: 16px; }
    .card .price { font-size: 14px; color: #555; }
    .card button { margin-top: 10px; padding: 6px 0; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
    .card button:hover { opacity: 0.9; }
    .summary { background: #fff; padding: 15px; border-right: 1px solid #ddd; overflow-y: auto; }
    .summary h3 { margin-top: 0; color: #ff6600; }
    .order-list { list-style: none; padding: 0; margin: 0; }
    .order-list li { background: #fafafa; padding: 10px; margin: 5px 0; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
    .order-list .note { font-size: 12px; color: #888; margin-top: 4px; width: 100%; text-align: right; }
    .order-list button { background: #dc3545; color: white; border: none; border-radius: 4px; padding: 4px 8px; cursor: pointer; }
    .order-footer { margin-top: 20px; font-weight: bold; text-align: right; }
  </style>
</head>
<body>
  <header>إدارة الطلبات - طاولة <span id="tableNum"></span></header>
  <div class="container">
    <aside class="sidebar">
      <h3>☆ المفضلة</h3>
      <ul id="favList"><!-- Filled dynamically --></ul>
      <h3>الأقسام</h3>
      <ul id="catList"></ul>
    </aside>
    <section class="main">
      <div class="items-grid" id="itemsGrid"><!-- Items appear here --></div>
    </section>
    <aside class="summary">
      <h3>ملخص الطلب</h3>
      <ul class="order-list" id="orderList"></ul>
      <div class="order-footer">الإجمالي: <span id="orderTotal">0</span> ج</div>
    </aside>
  </div>  <script>
    const tableNum = localStorage.getItem('currentTable') || '?';
    document.getElementById('tableNum').textContent = tableNum;
    const menu = JSON.parse(localStorage.getItem('menu')) || [];
    let orders = JSON.parse(localStorage.getItem(`orders_${tableNum}`)) || [];

    const catList = document.getElementById('catList');
    const itemsGrid = document.getElementById('itemsGrid');
    const orderList = document.getElementById('orderList');
    const orderTotal = document.getElementById('orderTotal');

    let currentCat = 0;

    function renderCategories() {
      catList.innerHTML = '';
      menu.forEach((cat, i) => {
        let li = document.createElement('li');
        li.textContent = cat.name;
        li.className = i === currentCat ? 'active' : '';
        li.onclick = () => { currentCat = i; renderCategories(); renderItems(); };
        catList.appendChild(li);
      });
    }

    function renderItems() {
      itemsGrid.innerHTML = '';
      (menu[currentCat]?.items || []).forEach((item, idx) => {
        let card = document.createElement('div'); card.className = 'card';
        card.innerHTML = `<h4>${item.name}</h4><div class="price">${item.price} ج</div>`;
        let btn = document.createElement('button'); btn.textContent = '+';
        btn.onclick = () => addOrder(item);
        card.appendChild(btn);
        itemsGrid.appendChild(card);
      });
    }

    function addOrder(item) {
      let note = prompt('إضافة ملاحظة (نوع/تعديل)') || '';
      let exist = orders.find(o => o.name === item.name && o.note === note);
      if (exist) exist.qty++; else orders.push({ name: item.name, price: item.price, qty:1, note });
      saveOrders(); renderOrders();
    }

    function renderOrders() {
      orderList.innerHTML = '';
      let total = 0;
      orders.forEach((o, i) => {
        total += o.price * o.qty;
        let li = document.createElement('li');
        li.innerHTML = `<div><strong>${o.name} × ${o.qty}</strong> <button onclick="removeOne(${i})">–</button><div class="note">${o.note || ''}</div></div><span>${o.price * o.qty} ج</span>`;
        orderList.appendChild(li);
      });
      orderTotal.textContent = total;
    }

    function removeOne(i) {
      if (orders[i].qty>1) orders[i].qty--; else orders.splice(i,1);
      saveOrders(); renderOrders();
    }

    function saveOrders() {
      localStorage.setItem(`orders_${tableNum}`, JSON.stringify(orders));
    }

    window.onload = () => {
      renderCategories(); renderItems(); renderOrders();
    };
  </script></body>
</html>
